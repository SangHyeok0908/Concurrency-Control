spring:
  application:
    name: reservation

  datasource:
    url: jdbc:mysql://localhost:3306/reservation
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

---
# ---------------------------------------------------------------------------
# 통합 테스트 공통 설정
#
# AbstractIntegrationTest 에 붙은 @ActiveProfiles("test") 로 활성화된다. 동시성 테스트
# 클래스마다 @TestPropertySource 로 똑같은 세 줄을 반복하던 것을 여기로 모았다.
#
# DB 접속 정보는 여기 두지 않는다 — Testcontainers 가 띄운 MySQL 로
# @ServiceConnection 이 런타임에 배선하므로 위쪽 datasource 설정은 테스트에서 무시된다.
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: test

  datasource:
    hikari:
      # 경쟁자 전원이 동시에 DB 에 닿아야 한 슬롯을 두고 진짜로 경쟁한다. 풀이 좁으면
      # 커넥션 대기가 요청을 알아서 직렬화해 버려 재현하려는 레이스가 사라진다.
      # 모든 동시성 테스트가 경쟁자 20명을 쓰므로 그 수에 맞춘다.
      maximum-pool-size: 20

  jpa:
    properties:
      hibernate:
        # 실측 로그(오버부킹 라운드, 재시도 분포)가 SQL 추적에 묻히지 않게 조용히 시킨다.
        show_sql: false

logging:
  level:
    # 따옴표 필수. YAML 1.1 은 따옴표 없는 OFF 를 <b>불리언 false</b> 로 읽어버려
    # 로그 레벨이 아닌 값이 바인딩된다(ON/OFF/YES/NO/TRUE/FALSE 가 모두 그렇다).
    org.hibernate.orm.jdbc.bind: "OFF"
