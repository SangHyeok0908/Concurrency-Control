spring:
  application:
    name: reservation

  datasource:
    url: jdbc:mysql://localhost:3306/reservation
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
