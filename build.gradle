plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	// 1단계 HTTP 부하 테스트. 별도 `gatling` 소스셋(src/gatling/java)과 gatlingRun 태스크를
	// 만든다. baseline은 측정만 하고 고치지 않으므로 측정 코드는 이 소스셋에만 둔다.
	// 3.13.x로 고정하는 이유: Spring Boot 3.5.16 BOM이 Netty를 4.1로 못박는데, Gatling은 3.14부터
	// Netty 4.2로 올라가 BOM과 충돌한다(gatlingRun이 NoClassDefFoundError로 죽음). 3.13 라인은
	// 아직 Netty 4.1이라 BOM과 그대로 정렬돼 별도 의존성 조정이 필요 없다. Java 21·Java DSL 모두 지원.
	id 'io.gatling.gradle' version '3.13.5.4'
}

group = 'com.interview'
version = '0.0.1-SNAPSHOT'
description = 'First-come-first-served interview reservation system: concurrency control experiment'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// Schema is versioned, not generated. Introducing each guard (UNIQUE, version
	// column) one step at a time is part of this project's argument, so it belongs
	// in migration history rather than in ddl-auto.
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// Tests run against real MySQL (InnoDB) via Testcontainers — H2 does not
	// reproduce the lock behavior the concurrency experiment depends on.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// 포크된 테스트 JVM은 daemon의 -Duser.timezone을 물려받지 않으므로 명시한다.
	systemProperty 'user.timezone', 'Asia/Seoul'
}

tasks.named('bootRun') {
	systemProperty 'user.timezone', 'Asia/Seoul'
}

// gatlingRun이 포크하는 JVM에도 같은 이유로 명시해야 시뮬레이션 로그가 한국 시간으로 찍힌다.
gatling {
	systemProperties = ['user.timezone': 'Asia/Seoul']
}
